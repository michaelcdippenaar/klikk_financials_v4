name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: klikk_ci
          POSTGRES_USER: klikk_ci
          POSTGRES_PASSWORD: klikk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: klikk_business_intelligence.settings.development
      DB_NAME: klikk_ci
      DB_USER: klikk_ci
      DB_PASSWORD: klikk_ci
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      SECRET_KEY: ci-only-not-a-real-secret
      # No provider credentials are supplied. Any code path that reaches Xero,
      # Investec or TM1 in CI is a defect, not something to configure around.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails if a model changed without a migration.
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      # Scoped to web_api_v2 until the apps/xero/xero_data tests.py + tests/
      # name collision is repaired; project-wide discovery currently fails.
      - name: V2 API tests
        run: python manage.py test apps.web_api_v2 --verbosity 2
