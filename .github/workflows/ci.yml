name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: klikk_ci
          POSTGRES_USER: klikk_ci
          POSTGRES_PASSWORD: klikk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: klikk_business_intelligence.settings.development
      DB_NAME: klikk_ci
      DB_USER: klikk_ci
      DB_PASSWORD: klikk_ci
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_CONN_MAX_AGE: '0'
      SECRET_KEY: ci-only-not-a-real-secret
      # No provider credentials are supplied. Any code path that reaches Xero,
      # Investec or TM1 in CI is a defect, not something to configure around.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      # The compose file is a deployment artefact. A service declared in the
      # wrong block parses as YAML but is rejected by compose, and nothing in
      # the Python suite would notice.
      - name: Compose file validation
        # Checks the file's shape, not its secrets: an empty .env satisfies
        # env_file so compose can parse, and a service declared in the wrong
        # block still fails here.
        run: |
          touch .env
          docker compose -f docker-compose.yml config --quiet
          rm .env

      # Fails if a model changed without a migration.
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      # The committed schema snapshot is the contract the frontend is built
      # against. If it drifts from the runtime schema, the frontend is
      # validating against a document the server no longer serves.
      - name: GraphQL schema drift check
        run: python manage.py export_graphql_schema --check

      - name: V2 API tests
        run: python manage.py test apps.web_api_v2 --verbosity 2

      # The whole suite is a blocking gate. It stays that way.
      - name: Full test suite
        run: python manage.py test --verbosity 1
