services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: klikk_business_intelligence.settings.staging
      # DB_HOST points to the host machine's Postgres (outside Docker).
      # host-gateway resolves to the Docker host IP automatically on Linux.
      DB_HOST: host-gateway
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles

  # Executes queued V2 ingest runs outside the request cycle. Standard sync
  # additionally requires WEB_API_V2_INGEST_WORKER_ENABLED; see
  # docs/ingest_worker.md before enabling it — it spends Xero API budget.
  #
  # entrypoint is cleared deliberately: the image entrypoint runs
  # `migrate --noinput` and ignores the command it is given, so a worker
  # started without this would migrate the database instead of draining runs.
  ingest-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: klikk_business_intelligence.settings.staging
      DB_HOST: host-gateway
    extra_hosts:
      - "host-gateway:host-gateway"
    entrypoint: []
    command: ["python", "manage.py", "run_ingest_worker"]
    depends_on:
      - web

volumes:
  media_files:
  static_files:
